name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Линт скиллов и config.yaml
        run: python tools/skill_lint.py

      - name: "Метка синхронизации: юнит-тесты"
        run: python tools/test_sync_state.py

      - name: "Гейт sync.sh: матрица состояний"
        run: bash tools/test_gate_matrix.sh

      - name: "profile-audit: тесты сканера"
        run: python tools/test_profile_audit.py

      - name: Секреты в истории git
        run: python tools/skill_lint.py --history

      - name: Версию в PR не меняют
        if: github.event_name == 'pull_request'
        run: |
          # Манифест в PR править можно: `distribution_owned`, `hermes_requires`, `env_requires` —
          # обычные факты дистрибутива. Запрещена именно версия: её поднимает владелец при релизе
          # (`python3 tools/release.py <версия>`), иначе история версий расходится с тегами.
          if git diff --unified=0 "origin/${{ github.base_ref }}...HEAD" -- distribution.yaml \
             | grep -qE '^[-+]version:'; then
            echo "::error file=distribution.yaml::Версию поднимает только владелец при релизе: python3 tools/release.py <версия>"
            exit 1
          fi
          echo "version в distribution.yaml не тронут — ок"
