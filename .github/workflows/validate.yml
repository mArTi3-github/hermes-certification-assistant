name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Линт скиллов и config.yaml
        run: python tools/skill_lint.py

      - name: Секреты в истории git
        run: python tools/skill_lint.py --history
