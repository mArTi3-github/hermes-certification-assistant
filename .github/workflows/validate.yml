name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Линт скиллов и config.yaml
        run: python tools/skill_lint.py

      - name: Секреты в истории git
        run: python tools/skill_lint.py --history

      - name: Версию в PR не меняют
        if: github.event_name == 'pull_request'
        run: |
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          if printf '%s\n' "$changed" | grep -qx 'distribution.yaml'; then
            echo "::error file=distribution.yaml::Версию поднимает только владелец при релизе: python3 tools/release.py <версия>"
            exit 1
          fi
          echo "distribution.yaml не тронут — ок"
